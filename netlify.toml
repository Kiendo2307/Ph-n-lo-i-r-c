# Netlify Configuration for AI Smart Bin (Vite React SPA)

[build]
  command = "npm run build"
  publish = "dist"

# Single-Page Application (SPA) rewrite rule: route all requests to /index.html
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Explicit MIME types and headers for static assets
[[headers]]
  for = "/assets/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=UTF-8"

[[headers]]
  for = "/*.js"
  [headers.values]
    Content-Type = "application/javascript; charset=UTF-8"

[[headers]]
  for = "/assets/*.css"
  [headers.values]
    Content-Type = "text/css; charset=UTF-8"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
